# deploy/observability/promtail.yml
#
# Reads Docker container log files and ships them to Loki.
# Loguru is configured to emit JSON in production (LOG_JSON=true),
# so each log line is already a valid JSON object.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Keep only prepatu-* containers to avoid noise
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        action: keep
        regex: (cloud|postgres)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        target_label: container
    pipeline_stages:
      # Parse the Docker JSON log wrapper
      - json:
          expressions:
            log:    log
            stream: stream
      - output:
          source: log
      # Parse the inner loguru JSON payload (when LOG_JSON=true)
      - json:
          expressions:
            level:   level
            message: text
            request_id: record.extra.request_id
          source: log
      - labels:
          level:
          service:
