# deploy/observability/docker-compose.yml
#
# Self-hosted observability stack: Prometheus + Loki + Promtail + Grafana.
#
# Run alongside the main stack:
#   docker compose -f ../docker-compose.yml -f docker-compose.yml up -d
#
# Grafana is intentionally NOT exposed on a public port.
# Access it via SSH tunnel:
#   ssh -L 3000:localhost:3000 user@your-vps
# then open http://localhost:3000 in your browser.

services:

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
      - external       # needs to reach the cloud service /metrics

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    # No ports exposed — use SSH tunnel to access
    expose:
      - "3000"

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  observability:
  external:
    external: true   # shared with the main stack
