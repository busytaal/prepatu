# deploy/docker-compose.yml
# Production VPS compose file.
#
# Usage:
#   cd /opt/prepatu/deploy
#   docker compose up -d
#
# Required env vars (set in /opt/prepatu/deploy/.env or via host environment):
#   POSTGRES_PASSWORD       — strong random password for the DB
#   JWT_SECRET              — random 64-byte hex string
#   GHCR_IMAGE              — e.g. ghcr.io/busytaal/prepatu-cloud:latest
#   PUBLIC_BASE_URL         — wss://api.prepatu.com
#   FRONTEND_URL            — https://prepatu.com
#   METRICS_TOKEN           — bearer token for /metrics scraping (optional)
#
#   SMTP_USER               — e.g. noreply@busytaal.com
#   SMTP_PASSWORD           — Zoho app password
#
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID  / GITHUB_CLIENT_SECRET
#
#   FREEMIUS_SECRET_KEY / FREEMIUS_PUBLIC_KEY
#   FREEMIUS_PLUGIN_ID
#   FREEMIUS_PLAN_STARTER / FREEMIUS_PLAN_STANDARD / FREEMIUS_PLAN_PRO
#
#   MASTER_DEEPGRAM_KEY, MASTER_OPENROUTER_KEY, etc.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       prepatu_cloud
      POSTGRES_USER:     prepatu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepatu -d prepatu_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cloud:
    image: ${GHCR_IMAGE:-ghcr.io/busytaal/prepatu-cloud:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:      "postgresql://prepatu:${POSTGRES_PASSWORD}@postgres:5432/prepatu_cloud"
      JWT_SECRET:        ${JWT_SECRET}
      PUBLIC_BASE_URL:   ${PUBLIC_BASE_URL:-wss://api.prepatu.io}
      LOG_JSON:          "true"
      LOG_LEVEL:         "INFO"
      METRICS_TOKEN:     ${METRICS_TOKEN:-}
      # Master provider keys (Prepatu-owned, used as fallback)
      MASTER_DEEPGRAM_KEY:    ${MASTER_DEEPGRAM_KEY:-}
      MASTER_OPENROUTER_KEY:  ${MASTER_OPENROUTER_KEY:-}
      MASTER_CARTESIA_KEY:    ${MASTER_CARTESIA_KEY:-}
      MASTER_OPENAI_KEY:      ${MASTER_OPENAI_KEY:-}
      MASTER_ELEVENLABS_KEY:  ${MASTER_ELEVENLABS_KEY:-}
      # Email (Zoho SMTP)
      SMTP_HOST:              ${SMTP_HOST:-smtp.zoho.com}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER:-}
      SMTP_PASSWORD:          ${SMTP_PASSWORD:-}
      EMAIL_FROM:             ${EMAIL_FROM:-Prepatu <noreply@busytaal.com>}
      EMAIL_REQUIRE_VERIFICATION: ${EMAIL_REQUIRE_VERIFICATION:-true}
      # OAuth
      GOOGLE_CLIENT_ID:       ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:   ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID:       ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET:   ${GITHUB_CLIENT_SECRET:-}
      # Frontend / redirect
      FRONTEND_URL:           ${FRONTEND_URL:-https://prepatu.com}
      # Freemius
      FREEMIUS_SECRET_KEY:    ${FREEMIUS_SECRET_KEY:-}
      FREEMIUS_PUBLIC_KEY:    ${FREEMIUS_PUBLIC_KEY:-}
      FREEMIUS_PLUGIN_ID:     ${FREEMIUS_PLUGIN_ID:-}
      FREEMIUS_PLAN_STARTER:  ${FREEMIUS_PLAN_STARTER:-}
      FREEMIUS_PLAN_STANDARD: ${FREEMIUS_PLAN_STANDARD:-}
      FREEMIUS_PLAN_PRO:      ${FREEMIUS_PLAN_PRO:-}
      FREEMIUS_SANDBOX:       ${FREEMIUS_SANDBOX:-false}
      # Paddle (add when verified)
      PADDLE_WEBHOOK_SECRET:  ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_ENVIRONMENT:     ${PADDLE_ENVIRONMENT:-sandbox}
    ports:
      - "4000:4000"
    networks:
      - internal
      - external
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  internal:
  external:
    name: prepatu-external
    external: true
