# deploy/docker-compose.yml
# Production VPS compose file.
#
# Usage:
#   cd /opt/prepatu/deploy
#   docker compose up -d
#
# Required env vars (set in /opt/prepatu/deploy/.env or via host environment):
#   POSTGRES_PASSWORD   — strong random password for the DB
#   JWT_SECRET          — random 64-byte hex string
#   METRICS_TOKEN       — bearer token for /metrics scraping (optional)
#   GHCR_IMAGE          — e.g. ghcr.io/busytaal/prepatu-cloud:latest
#   PUBLIC_BASE_URL     — wss://api.yourdomain.com
#   MASTER_DEEPGRAM_KEY, MASTER_OPENROUTER_KEY, etc.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       prepatu_cloud
      POSTGRES_USER:     prepatu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepatu -d prepatu_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cloud:
    image: ${GHCR_IMAGE:-ghcr.io/busytaal/prepatu-cloud:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:      "postgresql://prepatu:${POSTGRES_PASSWORD}@postgres:5432/prepatu_cloud"
      JWT_SECRET:        ${JWT_SECRET}
      PUBLIC_BASE_URL:   ${PUBLIC_BASE_URL:-wss://api.prepatu.io}
      LOG_JSON:          "true"
      LOG_LEVEL:         "INFO"
      METRICS_TOKEN:     ${METRICS_TOKEN:-}
      # Master provider keys (Prepatu-owned, used as fallback)
      MASTER_DEEPGRAM_KEY:    ${MASTER_DEEPGRAM_KEY:-}
      MASTER_OPENROUTER_KEY:  ${MASTER_OPENROUTER_KEY:-}
      MASTER_CARTESIA_KEY:    ${MASTER_CARTESIA_KEY:-}
      MASTER_OPENAI_KEY:      ${MASTER_OPENAI_KEY:-}
      MASTER_ELEVENLABS_KEY:  ${MASTER_ELEVENLABS_KEY:-}
    ports:
      - "4000:4000"
    networks:
      - internal
      - external
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_data:

networks:
  internal:
  external:
