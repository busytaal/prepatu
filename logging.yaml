version: 1
disable_existing_loggers: False

formatters:
  simple:
    format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"

handlers:
  file:
    class: logging.FileHandler
    formatter: simple
    filename: app.log
    mode: w   # <-- THIS is the key (overwrite)
    level: DEBUG

  console:
    class: logging.StreamHandler
    formatter: simple
    level: DEBUG

root:
  level: DEBUG
  handlers: [file, console]

loggers:
  openai:
    level: INFO
    propagate: True
  httpx:
    level: INFO
    propagate: True
  httpcore:
    level: INFO
    propagate: True
  uvicorn.error:
    level: INFO
    propagate: True
  aiortc:
    level: INFO
    propagate: True
  aioice:
    level: INFO
    propagate: True
  websockets.client:
    level: INFO
    propagate: True
  websockets.protocol:
    level: INFO
    propagate: True