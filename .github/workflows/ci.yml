# .github/workflows/ci.yml
# Runs on every PR and push to main/dev.
# Jobs:
#   test  — lint + full test suite against a real Postgres instance
#   build — builds & pushes the Docker image to GHCR (main branch only)

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       prepatu_test
          POSTGRES_USER:     prepatu
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd "pg_isready -U prepatu -d prepatu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short
        env:
          DATABASE_URL: postgresql://prepatu:testpass@localhost:5432/prepatu_test
          JWT_SECRET:   test-jwt-secret-not-for-production
          LOG_JSON:     "false"
          LOG_LEVEL:    "WARNING"

  # ── Docker build & push ─────────────────────────────────────────────────────
  build:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    # Only push on commits to main (not on PRs from forks)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/prepatu-cloud
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    .
          file:       services/cloud/Dockerfile
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to VPS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/prepatu/deploy

            echo "==> Pulling latest cloud image"
            docker compose pull cloud

            echo "==> Restarting cloud service"
            docker compose up -d --no-deps --force-recreate cloud

            echo "==> Pruning old images"
            docker image prune -f

            echo "==> Deploy complete"
            docker compose ps cloud
