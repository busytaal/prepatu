[project]
name = "prepatu-ielts"
version = "0.1.0"
description = "Prepatu IELTS Speaking practice app — reference implementation of vfdl"
requires-python = ">=3.12"
dependencies = [
    "vfdl",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "loguru",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ielts"]
