<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Editor — Prepatu</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #23263a;
    --border: #2e3148; --accent: #6c63ff; --accent2: #a78bfa;
    --text: #e2e8f0; --muted: #64748b; --green: #22c55e;
    --red: #ef4444; --yellow: #f59e0b;
    --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           background: var(--surface); border-bottom: 1px solid var(--border);
           flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--accent2); }
  .flow-sel { background: var(--surface2); border: 1px solid var(--border);
              color: var(--text); padding: 6px 10px; border-radius: 6px;
              font-size: 13px; cursor: pointer; }
  .btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
         cursor: pointer; border: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ── Graph panel ── */
  #graph-panel { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border);
                 background: var(--surface); overflow: hidden; position: relative; }
  #graph-panel h2 { font-size: 12px; font-weight: 600; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .08em;
                    padding: 12px 16px 8px; }
  svg#graph { width: 100%; height: calc(100% - 48px); }
  .state-node rect { fill: var(--surface2); stroke: var(--border); stroke-width: 1.5;
                     rx: 8; cursor: pointer; transition: stroke .15s; }
  .state-node.active rect { stroke: var(--accent); stroke-width: 2; }
  .state-node text { fill: var(--text); font-size: 12px; font-family: var(--font);
                     pointer-events: none; }
  .state-node .badge { fill: var(--accent); rx: 4; }
  .edge { stroke: var(--border); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .edge.gate { stroke: var(--yellow); stroke-dasharray: 4 3; }

  /* ── Form panel ── */
  #form-panel { flex: 1; overflow-y: auto; padding: 24px; }
  #form-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: var(--accent2); }
  .section { background: var(--surface); border: 1px solid var(--border);
             border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase;
                   letter-spacing: .1em; color: var(--muted); margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px;
    font-family: var(--font); transition: border-color .15s; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--surface2); border: 1px solid var(--border);
          padding: 3px 10px; border-radius: 20px; font-size: 12px;
          display: flex; align-items: center; gap: 6px; }
  .chip-x { cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; }
  .chip-x:hover { color: var(--red); }
  .add-chip { display: flex; gap: 6px; margin-top: 8px; }
  .add-chip input { flex: 1; }
  .trans-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .trans-row input { flex: 1; }
  .trans-row select { flex: 1; }
  .gate-box { background: var(--surface2); border: 1px solid var(--yellow);
              border-radius: 8px; padding: 12px; margin-top: 8px; }
  .gate-box label { color: var(--yellow); font-size: 11px; font-weight: 700;
                    text-transform: uppercase; letter-spacing: .08em; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 60px 20px; }
  .var-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .var-row input, .var-row select { flex: 1; }
  .tag { display: inline-block; background: var(--accent); color: #fff;
         font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; }
  .tag.engine { background: var(--yellow); color: #000; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <h1>⚡ Flow Editor</h1>
  <select id="flowSelect" class="flow-sel"></select>
  <button class="btn btn-ghost btn-sm" onclick="loadFlow()">Reload</button>
  <button class="btn btn-primary btn-sm" onclick="saveFlow()">Save</button>
  <button class="btn btn-ghost btn-sm" onclick="addState()">+ State</button>
  <span id="status">Loading…</span>
</header>
<div class="layout">
  <div id="graph-panel">
    <h2>Flow Graph</h2>
    <svg id="graph">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#2e3148"/>
        </marker>
      </defs>
    </svg>
  </div>
  <div id="form-panel">
    <div class="empty" id="empty-msg">Select a flow above, then click a state in the graph to edit it.</div>
    <div id="state-editor" style="display:none"></div>
  </div>
</div>

<script>
let flow = null;
let currentState = null;
const API = '';

// ── Bootstrap ──────────────────────────────────────────────────────────────────
async function init() {
  const res = await fetch(`${API}/flows`);
  const { flows } = await res.json();
  const sel = document.getElementById('flowSelect');
  flows.forEach(f => {
    const o = document.createElement('option'); o.value = f; o.textContent = f;
    sel.appendChild(o);
  });
  sel.onchange = loadFlow;
  if (flows.length) loadFlow();
}

async function loadFlow() {
  const name = document.getElementById('flowSelect').value;
  if (!name) return;
  setStatus('Loading…');
  const res = await fetch(`${API}/flows/${name}`);
  flow = await res.json();
  currentState = null;
  renderGraph();
  document.getElementById('state-editor').style.display = 'none';
  document.getElementById('empty-msg').style.display = '';
  setStatus(`Loaded: ${name}`);
}

async function saveFlow() {
  const name = document.getElementById('flowSelect').value;
  if (!flow || !name) return;
  setStatus('Saving…');
  const res = await fetch(`${API}/flows/${name}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(flow)
  });
  const data = await res.json();
  setStatus(data.ok ? `Saved ✓ ${new Date().toLocaleTimeString()}` : 'Save failed!');
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function addState() {
  if (!flow) return;
  const name = prompt('State name (e.g. collect_email):');
  if (!name || flow.states[name]) return;
  flow.states[name] = {
    agent: { prompt: '', tools: [] },
    transitions: { on_tool_call: {}, on_ui_event: {}, on_action: {} }
  };
  renderGraph();
  selectState(name);
}

// ── Graph rendering ────────────────────────────────────────────────────────────
function renderGraph() {
  const svg = document.getElementById('graph');
  svg.innerHTML = `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#2e3148"/></marker></defs>`;
  if (!flow?.states) return;

  const states = Object.keys(flow.states);
  const W = 300, nw = 140, nh = 36, gap = 56;
  const positions = {};
  states.forEach((s, i) => {
    positions[s] = { x: (W - nw) / 2, y: 16 + i * (nh + gap) };
  });

  // Draw edges first (so nodes appear on top)
  states.forEach(s => {
    const st = flow.states[s];
    const allTargets = new Set();
    Object.values(st.transitions?.on_tool_call || {}).forEach(t => {
      const target = typeof t === 'string' ? t : t?.target;
      if (target) allTargets.add({ target, gate: false });
    });
    Object.values(st.transitions?.on_ui_event || {}).forEach(t => allTargets.add({ target: t, gate: false }));
    if (st.confirmation_gate?.on_confirm) allTargets.add({ target: st.confirmation_gate.on_confirm, gate: true });

    allTargets.forEach(({ target, gate }) => {
      if (!positions[target]) return;
      const fx = positions[s].x + nw / 2, fy = positions[s].y + nh;
      const tx = positions[target].x + nw / 2, ty = positions[target].y;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const cy = (fy + ty) / 2;
      line.setAttribute('d', `M${fx},${fy} C${fx},${cy} ${tx},${cy} ${tx},${ty}`);
      line.setAttribute('class', `edge${gate ? ' gate' : ''}`);
      svg.appendChild(line);
    });
  });

  // Draw nodes
  states.forEach(s => {
    const { x, y } = positions[s];
    const isInitial = s === flow.initial_state;
    const hasGate = !!flow.states[s].confirmation_gate;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', `state-node${s === currentState ? ' active' : ''}`);
    g.setAttribute('transform', `translate(${x},${y})`);
    g.onclick = () => selectState(s);

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', nw); rect.setAttribute('height', nh);
    rect.setAttribute('rx', 8);
    g.appendChild(rect);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', 12); text.setAttribute('y', 22);
    text.textContent = s;
    g.appendChild(text);

    if (isInitial) {
      const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      badge.setAttribute('x', nw - 10); badge.setAttribute('y', 22);
      badge.setAttribute('text-anchor', 'end'); badge.setAttribute('font-size', '10');
      badge.setAttribute('fill', '#6c63ff'); badge.textContent = '▶';
      g.appendChild(badge);
    }
    if (hasGate) {
      const gate = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      gate.setAttribute('x', nw - 26); gate.setAttribute('y', 22);
      gate.setAttribute('text-anchor', 'end'); gate.setAttribute('font-size', '10');
      gate.setAttribute('fill', '#f59e0b'); gate.textContent = '🔒';
      g.appendChild(gate);
    }
    svg.appendChild(g);
  });

  // Resize svg height
  const totalH = states.length * (nh + gap) + 32;
  svg.setAttribute('height', totalH);
}

// ── State editor ───────────────────────────────────────────────────────────────
function selectState(name) {
  currentState = name;
  renderGraph();
  document.getElementById('empty-msg').style.display = 'none';
  const editor = document.getElementById('state-editor');
  editor.style.display = '';
  const st = flow.states[name];
  const allStates = Object.keys(flow.states).filter(s => s !== name);

  editor.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <h2 style="margin:0">${name}</h2>
      ${name === flow.initial_state ? '<span class="tag">initial</span>' : `<button class="btn btn-ghost btn-sm" onclick="setInitial('${name}')">Set as initial</button>`}
      <button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="deleteState('${name}')">Delete state</button>
    </div>

    <div class="section">
      <div class="section-title">UI Artifact</div>
      <div class="field">
        <label>Artifact type</label>
        <select id="ui_type" onchange="syncUiType()">
          <option value="">— none —</option>
          ${['form','options','card','orb_layout','navigate','feedback','dismiss','custom'].map(t =>
            `<option value="${t}"${st.ui?.artifact_type===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div id="ui_extra"></div>
    </div>

    <div class="section">
      <div class="section-title">Agent</div>
      <div class="field">
        <label>Prompt</label>
        <textarea id="agent_prompt" rows="5">${st.agent?.prompt || ''}</textarea>
      </div>
      <div class="field">
        <label>Tools <span style="color:var(--muted)">(one per line — engine tools auto-added)</span></label>
        <div class="chips" id="tools_chips"></div>
        <div class="add-chip">
          <input id="tool_input" placeholder="tool_name" onkeydown="if(event.key==='Enter')addTool()">
          <button class="btn btn-ghost btn-sm" onclick="addTool()">Add</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Confirmation Gate <span class="tag engine">engine</span></div>
      <div class="field">
        <label><input type="checkbox" id="gate_enabled" onchange="toggleGate()"> Enable confirmation gate</label>
      </div>
      <div id="gate_cfg" style="display:none"></div>
    </div>

    <div class="section">
      <div class="section-title">Transitions</div>
      <div style="margin-bottom:10px">
        <div class="section-title" style="margin-bottom:6px">On tool call</div>
        <div id="trans_tool"></div>
        <div class="add-chip">
          <input id="tt_tool" placeholder="tool_name">
          <select id="tt_target">${allStates.map(s=>`<option>${s}</option>`).join('')}</select>
          <button class="btn btn-ghost btn-sm" onclick="addToolTrans()">Add</button>
        </div>
      </div>
      <div style="margin-bottom:10px">
        <div class="section-title" style="margin-bottom:6px">On UI event</div>
        <div id="trans_ui"></div>
        <div class="add-chip">
          <input id="tu_event" placeholder="event_name">
          <select id="tu_target">${allStates.map(s=>`<option>${s}</option>`).join('')}</select>
          <button class="btn btn-ghost btn-sm" onclick="addUiTrans()">Add</button>
        </div>
      </div>
    </div>

    <div class="section" style="display:flex;justify-content:flex-end;gap:8px">
      <button class="btn btn-primary" onclick="applyState()">Apply changes</button>
    </div>
  `;

  // Populate tools chips
  renderToolChips(st.agent?.tools || []);

  // Populate gate
  const hasGate = !!st.confirmation_gate;
  document.getElementById('gate_enabled').checked = hasGate;
  if (hasGate) { document.getElementById('gate_cfg').style.display = ''; renderGate(st.confirmation_gate, allStates); }

  // Populate transitions
  renderTransitions(st.transitions, allStates);
  syncUiType();
}

function renderToolChips(tools) {
  const c = document.getElementById('tools_chips');
  if (!c) return;
  c.innerHTML = tools.map(t => `
    <span class="chip">${t}<span class="chip-x" onclick="removeTool('${t}')">×</span></span>
  `).join('');
}

function addTool() {
  const inp = document.getElementById('tool_input');
  const name = inp.value.trim(); if (!name) return;
  const st = flow.states[currentState];
  if (!st.agent.tools.includes(name)) st.agent.tools.push(name);
  renderToolChips(st.agent.tools); inp.value = '';
}

function removeTool(t) {
  const st = flow.states[currentState];
  st.agent.tools = st.agent.tools.filter(x => x !== t);
  renderToolChips(st.agent.tools);
}

function toggleGate() {
  const enabled = document.getElementById('gate_enabled').checked;
  const cfg = document.getElementById('gate_cfg');
  cfg.style.display = enabled ? '' : 'none';
  if (enabled) {
    const allStates = Object.keys(flow.states).filter(s => s !== currentState);
    renderGate({ variables: [], on_confirm: allStates[0] || '', on_reject: { action: 'clear', target: currentState } }, allStates);
  }
}

function renderGate(gate, allStates) {
  document.getElementById('gate_cfg').innerHTML = `
    <div class="gate-box">
      <div class="field" style="margin-top:8px">
        <label>Variables to confirm (comma-separated)</label>
        <input id="gate_vars" value="${(gate.variables||[]).join(', ')}">
      </div>
      <div class="field">
        <label>On confirm → state</label>
        <select id="gate_confirm">${allStates.map(s=>`<option${s===gate.on_confirm?' selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>On reject → state</label>
        <select id="gate_reject">${allStates.map(s=>`<option${s===gate.on_reject?.target?' selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
  `;
}

function syncUiType() {
  const type = document.getElementById('ui_type')?.value;
  const extra = document.getElementById('ui_extra');
  if (!extra) return;
  const st = flow.states[currentState];
  const ui = st.ui || {};
  if (type === 'form') {
    extra.innerHTML = `<div class="field"><label>Prompt</label><input id="ui_prompt" value="${ui.prompt||''}"></div>`;
  } else if (type === 'options') {
    extra.innerHTML = `<div class="field"><label>Prompt</label><input id="ui_prompt" value="${ui.prompt||''}"></div>`;
  } else if (type === 'orb_layout') {
    extra.innerHTML = `<div class="field"><label>Position</label>
      <select id="ui_position">${['center','bottom','bottom_right','top_right'].map(p=>`<option${p===ui.position?' selected':''}>${p}</option>`).join('')}</select></div>`;
  } else if (type === 'navigate') {
    extra.innerHTML = `<div class="field"><label>Screen name</label><input id="ui_screen" value="${ui.screen||''}"></div>`;
  } else {
    extra.innerHTML = '';
  }
}

function renderTransitions(trans, allStates) {
  const ttDiv = document.getElementById('trans_tool');
  const tuDiv = document.getElementById('trans_ui');
  if (!ttDiv || !tuDiv) return;
  const tc = trans?.on_tool_call || {};
  ttDiv.innerHTML = Object.entries(tc).map(([tool, target]) => {
    const t = typeof target === 'string' ? target : target?.target || '';
    return `<div class="trans-row">
      <input value="${tool}" readonly style="opacity:.6">
      <span style="color:var(--muted)">→</span>
      <input value="${t}" readonly style="opacity:.6">
      <button class="btn btn-ghost btn-sm" onclick="removeToolTrans('${tool}')">×</button>
    </div>`;
  }).join('');
  const uc = trans?.on_ui_event || {};
  tuDiv.innerHTML = Object.entries(uc).map(([event, target]) => `
    <div class="trans-row">
      <input value="${event}" readonly style="opacity:.6">
      <span style="color:var(--muted)">→</span>
      <input value="${target}" readonly style="opacity:.6">
      <button class="btn btn-ghost btn-sm" onclick="removeUiTrans('${event}')">×</button>
    </div>`).join('');
}

function addToolTrans() {
  const tool = document.getElementById('tt_tool').value.trim();
  const target = document.getElementById('tt_target').value;
  if (!tool || !target) return;
  const st = flow.states[currentState];
  if (!st.transitions) st.transitions = {};
  if (!st.transitions.on_tool_call) st.transitions.on_tool_call = {};
  st.transitions.on_tool_call[tool] = target;
  const allStates = Object.keys(flow.states).filter(s => s !== currentState);
  renderTransitions(st.transitions, allStates);
  document.getElementById('tt_tool').value = '';
}

function addUiTrans() {
  const event = document.getElementById('tu_event').value.trim();
  const target = document.getElementById('tu_target').value;
  if (!event || !target) return;
  const st = flow.states[currentState];
  if (!st.transitions) st.transitions = {};
  if (!st.transitions.on_ui_event) st.transitions.on_ui_event = {};
  st.transitions.on_ui_event[event] = target;
  const allStates = Object.keys(flow.states).filter(s => s !== currentState);
  renderTransitions(st.transitions, allStates);
  document.getElementById('tu_event').value = '';
}

function removeToolTrans(tool) {
  delete flow.states[currentState].transitions.on_tool_call[tool];
  const allStates = Object.keys(flow.states).filter(s => s !== currentState);
  renderTransitions(flow.states[currentState].transitions, allStates);
}

function removeUiTrans(event) {
  delete flow.states[currentState].transitions.on_ui_event[event];
  const allStates = Object.keys(flow.states).filter(s => s !== currentState);
  renderTransitions(flow.states[currentState].transitions, allStates);
}

function setInitial(name) { flow.initial_state = name; renderGraph(); }

function deleteState(name) {
  if (!confirm(`Delete state "${name}"?`)) return;
  delete flow.states[name];
  currentState = null;
  renderGraph();
  document.getElementById('state-editor').style.display = 'none';
  document.getElementById('empty-msg').style.display = '';
}

function applyState() {
  const st = flow.states[currentState];
  // Agent
  st.agent.prompt = document.getElementById('agent_prompt').value;
  // UI
  const uiType = document.getElementById('ui_type').value;
  if (uiType) {
    st.ui = { artifact_type: uiType };
    const prompt = document.getElementById('ui_prompt');
    if (prompt) st.ui.prompt = prompt.value;
    const pos = document.getElementById('ui_position');
    if (pos) st.ui.position = pos.value;
    const screen = document.getElementById('ui_screen');
    if (screen) st.ui.screen = screen.value;
  } else {
    st.ui = null;
  }
  // Confirmation gate
  const gateEnabled = document.getElementById('gate_enabled').checked;
  if (gateEnabled) {
    const vars = document.getElementById('gate_vars')?.value.split(',').map(v=>v.trim()).filter(Boolean) || [];
    const onConfirm = document.getElementById('gate_confirm')?.value || '';
    const onReject = document.getElementById('gate_reject')?.value || currentState;
    st.confirmation_gate = { variables: vars, on_confirm: onConfirm, on_reject: { action: 'clear', target: onReject } };
  } else {
    st.confirmation_gate = null;
  }
  renderGraph();
  setStatus('Changes applied (not saved)');
}

init();
</script>
</body>
</html>
