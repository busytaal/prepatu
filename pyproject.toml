[project]
name = "prepatu-workspace"
version = "0.1.0"
description = "Prepatu monorepo workspace root"
requires-python = ">=3.12"

[tool.uv]
dev-dependencies = [
    "httpx",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.workspace]
members = [
    "packages/vfdl",
    "apps/ielts/backend",
    "services/cloud",
]

[tool.uv.sources]
vfdl = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["apps/ielts/backend"]

[tool.pyright]
extraPaths = ["apps/ielts/backend"]
