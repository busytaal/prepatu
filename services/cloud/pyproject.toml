[project]
name = "prepatu-cloud"
version = "0.1.0"
description = "Prepatu managed cloud API — auth, credits, provider keys, usage reporting"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv",
    "aiosqlite",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "loguru",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "vfdl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloud"]
