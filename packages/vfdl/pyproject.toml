[project]
name = "vfdl"
version = "0.1.0"
description = "Voice Flow Definition Language — tenant-agnostic voice pipeline runtime"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pipecat-ai[cartesia,deepgram,fastapi,openai,silero,webrtc,websocket]",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "aiosqlite",
    "pyyaml>=6.0.3",
    "pydantic>=2.12.5",
    "loguru",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vfdl"]
